<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vektoru Bingo</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: #1a252f; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #555; margin-bottom: 25px; text-align: center; }
        
        /* Grid kontrole */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 100%; max-width: 800px; }
        
        /* Pogas */
        .card { 
            background: #ffffff; border: 3px solid #3498db; border-radius: 12px; 
            height: 100px; display: flex; align-items: center; justify-content: center; 
            font-size: 2rem; font-weight: bold; color: #2c3e50; cursor: pointer; 
            transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 12px rgba(0,0,0,0.1); background-color: #ebf5fb; }
        
        /* Atvērtās / izmantotās pogas */
        .card.used { background-color: #bdc3c7; border-color: #7f8c8d; color: #7f8c8d; cursor: not-allowed; transform: none; box-shadow: none; }
        .card.used::after { content: " ✓"; font-size: 1.5rem; }

        /* Modal loga stils */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 650px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .q-number { font-size: 1.2rem; color: #3498db; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .q-text { font-size: 2.2rem; color: #2c3e50; margin-bottom: 30px; font-weight: 600; line-height: 1.3; }
        
        /* Poga aizvēršanai */
        .close-btn { background: #2ecc71; color: white; border: none; padding: 15px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
        .close-btn:hover { background: #27ae60; }
        
        /* Atiestatīšanas poga */
        .reset-btn { margin-top: 30px; background: none; border: 2px solid #7f8c8d; color: #7f8c8d; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
        .reset-btn:hover { background: #7f8c8d; color: white; }
    </style>
</head>
<body>

    <h1>VEKTORU BINGO</h1>
    <p class="subtitle">Izvēlies uzdevuma numuru un atklāj jautājumu!</p>

    <div class="grid" id="bingoGrid"></div>

    <button class="reset-btn" onclick="resetGame()">Sākt jaunu spēli</button>

    <!-- Modal logs jautājumam -->
    <div class="modal" id="qModal">
        <div class="modal-content">
            <div class="q-number" id="qNum">Uzdevums #1</div>
            <div class="q-text" id="qText">Jautājuma teksts...</div>
            <button class="close-btn" onclick="closeModal()">Aizvērt un atzīmēt kā bijušu</button>
        </div>
    </div>

    <script>
        // Uzdevumu saraksts (25 uzdevumi)
        const questions = [
            "AB + BC = ?",
            "AC + CB = ?",
            "BA + AC = ?",
            "Vektoram AB pretējais vektors ir...?",
            "Cik liels ir nulles vektora garums?",
            "Cik liels ir vienības vektora garums?",
            "Trijstūra mala ir 5 cm. Cik liels ir tās malas vektora garums?",
            "Taisnstūra malas ir 6 un 8 cm. Cik garš ir tā diagonāles vektors?",
            "Vienādojums: a + a = ?",
            "Vienādojums: 5a - 2a = ?",
            "Vektoram a pretējais vektors ir...?",
            "Puse no vektora a rakstās kā...?",
            "Kā sauc vektoru, kura sākumpunkts sakrīt ar galapunktu?",
            "Kā sauc vektoru, kura garums ir tieši 1 vienība?",
            "Kā sauc vektorus, kas atrodas uz paralēlām taisnēm vai vienas taisnes?",
            "Kā sauc kolineārus vektorus ar vienādu garumu, bet pretēju virzienu?",
            "Kā sauc kolineārus vektorus ar vienādu garumu un vienādu virzienu?",
            "Kā sauc paņēmienu, kur otrā vektora sākumu pieliek pirmajam galam?",
            "Kā sauc paņēmienu, kur abus vektorus atliek no viena punkta?",
            "Kā citādi sauc vektora garumu?",
            "Vektors ir nogrieznis, kuram bez garuma ir noteikts arī...?",
            "Punkts A apzīmējumā AB (vektors) ir vektora...?",
            "Punkts B apzīmējumā AB (vektors) ir vektora...?",
            "Kā sauc lielumu, kuram ir tikai skaitliska vērtība (bez virziena)?",
            "Uz kādām taisnēm atrodas kolineāri vektori?"
        ];

        let currentActiveCard = null;

        function initGrid() {
            const grid = document.getElementById('bingoGrid');
            grid.innerHTML = '';
            
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = index + 1;
                card.onclick = () => openQuestion(index + 1, q, card);
                grid.appendChild(card);
            });
        }

        function openQuestion(num, text, cardElement) {
            if (cardElement.classList.contains('used')) return;
            
            currentActiveCard = cardElement;
            document.getElementById('qNum').innerText = `Uzdevums #${num}`;
            document.getElementById('qText').innerText = text;
            document.getElementById('qModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('qModal').style.display = 'none';
            if (currentActiveCard) {
                currentActiveCard.classList.add('used');
            }
        }

        function resetGame() {
            if (confirm("Vai tiešām vēlies sākt no jauna un noņemt visas atzīmes?")) {
                initGrid();
            }
        }

        // Palaist spēli uzreiz
        initGrid();
    </script>
</body>
</html>
